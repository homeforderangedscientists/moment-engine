name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build
      - name: Publish dry-run
        run: npm publish --dry-run --provenance --access public
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Slack publish notification
        if: success()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping notification"
            exit 0
          fi
          PAYLOAD=$(jq -n --arg v "$VERSION" \
            '{text: (":package: Published moment-engine@" + $v + " to npm")}')
          curl -s -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"
