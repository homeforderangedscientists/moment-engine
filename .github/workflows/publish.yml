name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build
      - name: Publish dry-run
        run: npm publish --dry-run --provenance --access public
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: Slack publish notification
        if: success()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping notification"
            exit 0
          fi
          PAYLOAD=$(jq -n --arg v "$VERSION" \
            '{text: (":package: Published moment-engine@" + $v + " to npm")}')
          curl -s -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"
